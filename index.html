<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego para Nosotros</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Caveat:wght@700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        h1 {
            font-family: 'Caveat', cursive;
            font-size: 3.5rem;
            color: #ff4b72;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #666;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            max-width: 600px;
        }

        .filter-btn {
            background-color: white;
            border: 2px solid #ff4b72;
            color: #ff4b72;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background-color: #ffe6eb;
        }

        .filter-btn.active {
            background-color: #ff4b72;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 75, 114, 0.3);
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 400px;
            height: 300px;
            margin-bottom: 40px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .card-front {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: white;
        }

        .card-front h2 {
            font-family: 'Caveat', cursive;
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .card-front p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .card-back {
            background-color: white;
            transform: rotateY(180deg);
            border: 4px solid #ff4b72;
        }

        .category-badge {
            position: absolute;
            top: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            color: #ff4b72;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 600;
            color: #333;
            line-height: 1.4;
        }

        .action-btn {
            background-color: #ff4b72;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 75, 114, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .action-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(255, 75, 114, 0.2);
        }

        /* Animación suave para el cambio de preguntas */
        .fade-in {
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Conociéndonos</h1>
        <p class="subtitle">Preguntas para reír, recordar y soñar juntos</p>
    </header>

    <div class="filters">
        <button class="filter-btn active" data-filter="todas">Todas</button>
        <button class="filter-btn" data-filter="niñez">Niñez</button>
        <button class="filter-btn" data-filter="adolescencia">Adolescencia</button>
        <button class="filter-btn" data-filter="actualidad">Actualidad</button>
        <button class="filter-btn" data-filter="futuro">Futuro (Risas)</button>
    </div>

    <div class="card-container" id="cardContainer">
        <div class="card" id="card">
            <div class="card-face card-front">
                <h2>¿Listos?</h2>
                <p>Toca el botón de abajo para revelar la primera pregunta</p>
            </div>
            <div class="card-face card-back">
                <span class="category-badge" id="categoryBadge">Categoría</span>
                <p class="question-text" id="questionText">Aquí aparecerá la pregunta</p>
            </div>
        </div>
    </div>

    <button class="action-btn" id="nextBtn">Siguiente Pregunta 🎲</button>

    <script>
        const questions = [
            // NIÑEZ (25)
            { text: "¿Cuál era tu juguete favorito y qué le pasó?", category: "niñez" },
            { text: "¿Cuál fue tu mayor travesura de niño/a?", category: "niñez" },
            { text: "¿A qué le tenías un miedo irracional o absurdo?", category: "niñez" },
            { text: "¿Qué caricatura no podías dejar de ver?", category: "niñez" },
            { text: "¿Qué comida odiabas con toda tu alma de niño/a?", category: "niñez" },
            { text: "¿Cuál es tu recuerdo más feliz de la infancia?", category: "niñez" },
            { text: "¿Tuviste algún amigo imaginario? ¿Cómo era?", category: "niñez" },
            { text: "¿Qué querías ser de grande cuando tenías 7 años?", category: "niñez" },
            { text: "¿Cuál fue tu golpe, caída o herida más tonta?", category: "niñez" },
            { text: "¿Cuál era tu dulce o golosina favorita en el recreo?", category: "niñez" },
            { text: "¿Te acuerdas de tu primera mascota? Cuéntame de ella.", category: "niñez" },
            { text: "¿Cuál fue el castigo más injusto que te dieron tus padres?", category: "niñez" },
            { text: "¿Qué creencia tonta tenías? (ej. tragar una semilla de sandía).", category: "niñez" },
            { text: "¿Quién fue tu primer 'crush' o amor de primaria?", category: "niñez" },
            { text: "¿A qué jugabas más en los recreos?", category: "niñez" },
            { text: "¿Cuál ha sido el mejor regalo de Navidad que recibiste?", category: "niñez" },
            { text: "¿Había alguna ropa que tu mamá te obligaba a usar y odiabas?", category: "niñez" },
            { text: "¿Qué cuento o historia te pedías que te leyeran siempre?", category: "niñez" },
            { text: "¿Qué palabra pronunciabas mal de pequeño/a y daba risa?", category: "niñez" },
            { text: "¿Tenías algún apodo en tu familia?", category: "niñez" },
            { text: "¿Cuál era tu escondite favorito para jugar a las escondidas?", category: "niñez" },
            { text: "¿Quién era tu héroe o ídolo de la infancia?", category: "niñez" },
            { text: "¿Alguna vez te perdiste en el supermercado? ¿Qué pasó?", category: "niñez" },
            { text: "¿Lloraste alguna vez en la escuela por una tontería?", category: "niñez" },
            { text: "Si pudieras volver un día entero a tu niñez, ¿qué harías?", category: "niñez" },

            // ADOLESCENCIA (25)
            { text: "¿Cuál fue tu peor corte de pelo o estilo de peinado?", category: "adolescencia" },
            { text: "¿Qué moda seguiste de la que hoy te mueres de vergüenza?", category: "adolescencia" },
            { text: "¿Cómo fue tu primer beso? (Sin omitir detalles bochornosos).", category: "adolescencia" },
            { text: "¿Cuál fue la peor nota que sacaste y cómo la escondiste?", category: "adolescencia" },
            { text: "¿Alguna vez te escapaste de casa o de la escuela?", category: "adolescencia" },
            { text: "¿Con qué banda, artista o actor estabas obsesionado/a?", category: "adolescencia" },
            { text: "¿Cuál fue tu momento 'trágame tierra' en la secundaria?", category: "adolescencia" },
            { text: "¿Cuál fue la regla más tonta que rompiste por rebeldía?", category: "adolescencia" },
            { text: "¿Tenías pósters en tu cuarto? ¿De quiénes?", category: "adolescencia" },
            { text: "¿Qué apodo tenías con tus amigos del colegio?", category: "adolescencia" },
            { text: "¿Qué materia te hacía llorar o te estresaba más?", category: "adolescencia" },
            { text: "¿Cómo fue tu peor cita en esa época?", category: "adolescencia" },
            { text: "¿Cuál fue la mentira más grande que le dijiste a tus papás?", category: "adolescencia" },
            { text: "¿Qué canción te hacía sentir súper triste, 'emo' o incomprendido/a?", category: "adolescencia" },
            { text: "¿Cuál fue la pelea más tonta que tuviste con un amigo/a?", category: "adolescencia" },
            { text: "¿Recuerdas tu primer celular? ¿Cómo era?", category: "adolescencia" },
            { text: "¿Qué locura hacías solo por encajar en un grupo?", category: "adolescencia" },
            { text: "¿Cómo te fue en tu fiesta de 15 años o fiesta de graduación?", category: "adolescencia" },
            { text: "¿Cuál fue tu mayor acto de rebeldía adolescente?", category: "adolescencia" },
            { text: "¿Qué te daba mucha inseguridad en esa época y hoy ya no?", category: "adolescencia" },
            { text: "¿Coleccionabas algo extraño en tu adolescencia?", category: "adolescencia" },
            { text: "¿Cuál fue tu primer trabajo o intento de ganar tu propio dinero?", category: "adolescencia" },
            { text: "¿Qué decían de ti los profesores?", category: "adolescencia" },
            { text: "Si pudieras decirle algo a tu 'yo' de 15 años, ¿qué sería?", category: "adolescencia" },
            { text: "¿Qué es lo que más extrañas de esa época de tu vida?", category: "adolescencia" },

            // ACTUALIDAD (25)
            { text: "¿Qué es lo que más te gusta de nosotros como pareja?", category: "actualidad" },
            { text: "¿Qué hábito mío te da risa aunque no lo admitas siempre?", category: "actualidad" },
            { text: "¿Cuál es tu momento favorito del día y por qué?", category: "actualidad" },
            { text: "¿Qué comida podrías comer todos los días sin hartarte?", category: "actualidad" },
            { text: "¿Cuál consideras que es tu mayor logro reciente?", category: "actualidad" },
            { text: "¿Qué es lo que más te estresa en este momento de tu vida?", category: "actualidad" },
            { text: "¿Cuál es tu forma favorita de relajarte después de un día pesado?", category: "actualidad" },
            { text: "¿Cuál ha sido la mejor cita que hemos tenido hasta ahora?", category: "actualidad" },
            { text: "¿Qué canción sientes que nos describe o te recuerda a mí?", category: "actualidad" },
            { text: "¿Tienes algún talento oculto que yo no haya visto aún?", category: "actualidad" },
            { text: "Si pudieras cambiar algo de tu rutina diaria, ¿qué sería?", category: "actualidad" },
            { text: "¿Cuál es tu manía o TOC más raro actualmente?", category: "actualidad" },
            { text: "¿Qué es lo que más valoras en tus amistades hoy en día?", category: "actualidad" },
            { text: "¿Cuál ha sido tu compra más inútil o impulsiva de este año?", category: "actualidad" },
            { text: "¿Cuál crees que es mi lenguaje del amor? ¿Y el tuyo?", category: "actualidad" },
            { text: "¿Qué pequeño detalle hace que te sientas muy amado/a por mí?", category: "actualidad" },
            { text: "¿Cuál es tu lugar favorito en el mundo ahora mismo?", category: "actualidad" },
            { text: "¿Qué tarea del hogar es la que más odias hacer?", category: "actualidad" },
            { text: "¿De qué tema serías capaz de hablar sin parar por 3 horas?", category: "actualidad" },
            { text: "¿Cuál es tu mayor miedo como adulto hoy en día?", category: "actualidad" },
            { text: "¿Qué es por lo que te sientes más agradecido/a hoy?", category: "actualidad" },
            { text: "¿Qué cosa nueva (hobby, habilidad) te gustaría aprender pronto?", category: "actualidad" },
            { text: "¿Cuál es el mejor regalo que te he dado hasta ahora?", category: "actualidad" },
            { text: "¿Qué pensaste exactamente de mí después de nuestra primera cita?", category: "actualidad" },
            { text: "¿Qué cualidad mía admiras más?", category: "actualidad" },

            // FUTURO - GRACIOSAS Y AMBIENTE (25)
            { text: "¿Quién de los dos se quejará más del dolor de rodillas a los 60 años?", category: "futuro" },
            { text: "Si hay un apocalipsis zombie, ¿quién muere primero por estar distraído/a en el celular?", category: "futuro" },
            { text: "¿Quién será el viejito gruñón que le grite a los niños que no jueguen frente a su casa?", category: "futuro" },
            { text: "Si ganamos la lotería, ¿qué estupidez carísima e inútil compraríamos primero?", category: "futuro" },
            { text: "¿Quién de los dos va a malcriar horriblemente a nuestras futuras mascotas (o hijos)?", category: "futuro" },
            { text: "¿Quién tiene más probabilidades de incendiar la cocina intentando hacer una cena a los 50 años?", category: "futuro" },
            { text: "¿Quién olvidará nuestro aniversario cuando tengamos Alzheimer selectivo?", category: "futuro" },
            { text: "¿Qué excentricidad rara tendremos de viejitos? (Ej. coleccionar figuras, vestir iguales...)", category: "futuro" },
            { text: "¿Quién será el primero en quedarse dormido en el cine a las 7 de la noche?", category: "futuro" },
            { text: "¿Quién de los dos terminará usando sandalias con calcetines argumentando 'comodidad'?", category: "futuro" },
            { text: "Si nos meten a un asilo de ancianos, ¿por qué motivo nos echarían de ahí?", category: "futuro" },
            { text: "¿Quién de los dos se va a volver el loco/a extremista de las plantas?", category: "futuro" },
            { text: "Si fuéramos un dúo de criminales en el futuro, ¿por qué crimen absurdo nos atraparían?", category: "futuro" },
            { text: "¿A quién estafarán primero por internet cuando seamos personas mayores?", category: "futuro" },
            { text: "¿Quién crees que va a roncar más fuerte dentro de 20 años?", category: "futuro" },
            { text: "¿Qué frase típica de 'en mis tiempos...' crees que repetiremos sin parar?", category: "futuro" },
            { text: "¿Quién será el viejito/a que esconda dulces envueltos en papel en los bolsillos de sus suéteres?", category: "futuro" },
            { text: "Si nos perdemos en un viaje a los 70 años, ¿quién se negará rotundamente a pedir indicaciones?", category: "futuro" },
            { text: "¿Quién será el abuelo/a que suba estados de WhatsApp por error o fotos borrosas a Facebook?", category: "futuro" },
            { text: "¿Qué programa de chismes o novelas terminaremos viendo religiosamente en nuestra jubilación?", category: "futuro" },
            { text: "¿Quién se quejará más diciendo 'qué ruido hace la música de los jóvenes de hoy'?", category: "futuro" },
            { text: "¿Quién tendrá la colección más inútil de objetos en la casa (como tuppers sin tapa o bolsas de plástico)?", category: "futuro" },
            { text: "Si nos convertimos en fantasmas, ¿a quién asustaríamos solo para reírnos de ellos?", category: "futuro" },
            { text: "¿Quién se va a obsesionar más con pelear por ofertas y cupones en el supermercado?", category: "futuro" },
            { text: "¿Quién será el que diga '¡te lo dije!' la mayor cantidad de veces de aquí a 40 años?", category: "futuro" }
        ];

        let currentCategory = 'todas';
        let availableQuestions = [];
        let isFlipped = false;

        const filterBtns = document.querySelectorAll('.filter-btn');
        const cardContainer = document.getElementById('cardContainer');
        const card = document.getElementById('card');
        const nextBtn = document.getElementById('nextBtn');
        const questionText = document.getElementById('questionText');
        const categoryBadge = document.getElementById('categoryBadge');

        // Inicializar
        resetAvailableQuestions();

        // Filtros
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Actualizar UI de botones
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                // Actualizar categoría y reiniciar preguntas
                currentCategory = e.target.getAttribute('data-filter');
                resetAvailableQuestions();
                
                // Volver la tarjeta al frente si estaba volteada
                if (isFlipped) {
                    card.classList.remove('flipped');
                    isFlipped = false;
                    setTimeout(() => {
                        nextBtn.textContent = "Siguiente Pregunta 🎲";
                    }, 400);
                }
            });
        });

        // Botón Siguiente Pregunta
        nextBtn.addEventListener('click', showNextQuestion);
        cardContainer.addEventListener('click', () => {
            if(!isFlipped) showNextQuestion();
        });

        function showNextQuestion() {
            if (availableQuestions.length === 0) {
                resetAvailableQuestions();
                // Si aún es 0 (ej. no hay de esa categoría, aunque aquí siempre habrá), previene error
                if(availableQuestions.length === 0) return;
            }

            // Seleccionar pregunta al azar
            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            const selectedQuestion = availableQuestions.splice(randomIndex, 1)[0];

            if (!isFlipped) {
                // Primera vez que se voltea
                updateCardContent(selectedQuestion);
                card.classList.add('flipped');
                isFlipped = true;
                nextBtn.textContent = "Siguiente Pregunta 🎲";
            } else {
                // Ya está volteada, efecto de desvanecimiento para cambiar texto
                questionText.classList.remove('fade-in');
                categoryBadge.classList.remove('fade-in');
                
                // Pequeño timeout para reiniciar la animación
                setTimeout(() => {
                    updateCardContent(selectedQuestion);
                    questionText.classList.add('fade-in');
                    categoryBadge.classList.add('fade-in');
                }, 50);
            }
        }

        function updateCardContent(q) {
            questionText.textContent = q.text;
            categoryBadge.textContent = q.category;
            
            // Cambiar color del badge según categoría
            let color = "#ff4b72";
            if(q.category === 'niñez') color = "#4b79ff";
            if(q.category === 'adolescencia') color = "#ff9900";
            if(q.category === 'actualidad') color = "#00cc66";
            if(q.category === 'futuro') color = "#9933cc";
            
            categoryBadge.style.color = color;
        }

        function resetAvailableQuestions() {
            if (currentCategory === 'todas') {
                availableQuestions = [...questions];
            } else {
                availableQuestions = questions.filter(q => q.category === currentCategory);
            }
        }
    </script>
</body>
</html>
